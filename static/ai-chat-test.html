<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Chat Test - Credit Risk</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        max-width: 860px;
        margin: 0 auto;
        padding: 1rem;
        background: #111827;
        color: #e5e7eb;
        min-height: 100vh;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 0.75rem;
        color: #cbd5e1;
      }
      h2 {
        font-size: 0.95rem;
        margin: 0.5rem 0;
        color: #cbd5e1;
      }
      .panel {
        background: #0b1220;
        border: 1px solid #1f2937;
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 0.5rem;
      }
      label {
        min-width: 110px;
        color: #94a3b8;
      }
      input,
      button,
      select,
      textarea {
        padding: 0.55rem 0.75rem;
        border: 1px solid #1f2937;
        border-radius: 10px;
        background: #0b1220;
        color: #e5e7eb;
        font-size: 0.95rem;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: #6366f1;
      }
      input[type="password"],
      input[type="text"],
      textarea,
      select {
        flex: 1;
        min-width: 180px;
      }
      textarea {
        width: 100%;
        min-height: 88px;
        resize: vertical;
      }
      button {
        cursor: pointer;
        background: #6366f1;
        color: #fff;
        border: none;
        font-weight: 600;
      }
      button:hover {
        background: #4f46e5;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        background: #111827;
        border: 1px solid #1f2937;
        color: #e5e7eb;
        font-weight: 500;
      }
      button.secondary:hover {
        background: #0b1220;
      }
      button.danger {
        background: #b91c1c;
      }
      button.danger:hover {
        background: #991b1b;
      }
      .status {
        font-size: 0.85rem;
        color: #94a3b8;
      }
      .status.error {
        color: #fca5a5;
      }
      .status.success {
        color: #34d399;
      }
      .pill {
        display: inline-block;
        padding: 0.1rem 0.6rem;
        border-radius: 999px;
        border: 1px solid #1f2937;
        color: #94a3b8;
        font-size: 0.75rem;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      #messages {
        min-height: 220px;
        max-height: 420px;
        overflow-y: auto;
        padding: 0.5rem 0;
      }
      .msg {
        margin-bottom: 0.75rem;
        padding: 0.7rem 0.85rem;
        border-radius: 12px;
        border: 1px solid #1f2937;
      }
      .msg.user {
        background: #0b1220;
      }
      .msg.assistant {
        background: #0a1a2f;
        border-left: 3px solid #6366f1;
      }
      .msg .role {
        font-size: 0.75rem;
        color: #94a3b8;
        margin-bottom: 0.25rem;
      }
      .msg .content {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg .meta {
        font-size: 0.72rem;
        color: #64748b;
        margin-top: 0.25rem;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #020617;
        border: 1px solid #1f2937;
        border-radius: 12px;
        padding: 0.75rem;
        margin: 0.5rem 0 0;
        max-height: 260px;
        overflow: auto;
        font-size: 0.85rem;
        color: #d1d5db;
      }
      .muted {
        color: #64748b;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>🔐 Đăng nhập / Token</h1>
      <div class="row">
        <label>API URL</label>
        <input id="apiBase" type="text" placeholder="http://localhost:8000" style="flex: 2; min-width: 260px" />
      </div>
      <div class="row">
        <label>User / Email</label>
        <input id="username" type="text" placeholder="admin@creditbank.com" />
      </div>
      <div class="row">
        <label>Mật khẩu</label>
        <input id="password" type="password" placeholder="••••••••" />
        <button id="btnLogin">Đăng nhập</button>
      </div>
      <div class="row">
        <label>Bearer token</label>
        <input id="tokenInput" type="password" placeholder="Dán token để test nhanh" style="flex: 2; min-width: 260px" />
        <button id="btnUseToken" class="secondary">Dùng token</button>
        <button id="btnLogout" class="danger" style="display: none">Đăng xuất</button>
      </div>
      <div class="row">
        <span id="loginStatus" class="status"></span>
      </div>
    </div>

    <div class="panel" id="chatPanel" style="display: none">
      <h1>💬 AI Chat (test)</h1>
      <div class="row">
        <label>Session</label>
        <input id="sessionId" type="text" placeholder="Để trống = auto tạo session" />
        <select id="sessionSelect">
          <option value="">(Chọn session…)</option>
        </select>
      </div>
      <div class="row">
        <span class="pill mono" id="sessionPill">session_id: (auto)</span>
        <span class="pill mono" id="providerPill">provider: —</span>
        <span class="pill mono" id="contextPill">context: —</span>
      </div>
      <div class="row">
        <button id="btnStart" class="secondary">Tạo session</button>
        <button id="btnHistory" class="secondary">Tải history</button>
        <button id="btnSessions" class="secondary">Tải sessions</button>
        <button id="btnDebug" class="secondary">Debug</button>
        <button id="btnContext" class="secondary">Context preview</button>
        <button id="btnClear" class="secondary">Clear</button>
        <span id="sendStatus" class="status" style="margin-left: auto"></span>
      </div>

      <div id="toolOutput" style="display: none">
        <h2 id="toolTitle">Output</h2>
        <pre id="toolPre" class="mono"></pre>
      </div>

      <div id="messages"></div>
      <div class="row">
        <textarea id="messageInput" placeholder="Nhập câu hỏi… (Enter gửi • Shift+Enter xuống dòng)"></textarea>
      </div>
      <div class="row">
        <button id="btnSend">Gửi</button>
        <span class="muted">Tip: Để trống session_id để backend tự tạo UUID (tránh lỗi SQL uniqueidentifier).</span>
      </div>
    </div>

    <script>
      (function () {
        const apiBaseInput = document.getElementById("apiBase");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const tokenInput = document.getElementById("tokenInput");
        const btnLogin = document.getElementById("btnLogin");
        const btnUseToken = document.getElementById("btnUseToken");
        const btnLogout = document.getElementById("btnLogout");
        const loginStatus = document.getElementById("loginStatus");

        const chatPanel = document.getElementById("chatPanel");
        const sessionIdInput = document.getElementById("sessionId");
        const sessionSelect = document.getElementById("sessionSelect");
        const sessionPill = document.getElementById("sessionPill");
        const providerPill = document.getElementById("providerPill");
        const contextPill = document.getElementById("contextPill");

        const btnStart = document.getElementById("btnStart");
        const btnHistory = document.getElementById("btnHistory");
        const btnSessions = document.getElementById("btnSessions");
        const btnDebug = document.getElementById("btnDebug");
        const btnContext = document.getElementById("btnContext");
        const btnClear = document.getElementById("btnClear");
        const sendStatus = document.getElementById("sendStatus");

        const toolOutput = document.getElementById("toolOutput");
        const toolTitle = document.getElementById("toolTitle");
        const toolPre = document.getElementById("toolPre");

        const messagesEl = document.getElementById("messages");
        const messageInput = document.getElementById("messageInput");
        const btnSend = document.getElementById("btnSend");

        function setStatus(el, text, kind) {
          el.textContent = text || "";
          el.className = "status" + (kind ? " " + kind : "");
        }

        function getBase() {
          const base = String(apiBaseInput.value || "").trim().replace(/\/$/, "");
          return base || window.location.origin.replace(/\/$/, "");
        }

        function getApiUrl(path) {
          return getBase() + "/api/v1" + path;
        }

        function isUuid(s) {
          return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(
            String(s || "").trim()
          );
        }

        let token = localStorage.getItem("ai_chat_token") || sessionStorage.getItem("ai_chat_token") || "";
        let currentSessionId =
          localStorage.getItem("ai_chat_session_id") || sessionStorage.getItem("ai_chat_session_id") || "";

        // init persisted inputs
        apiBaseInput.value = localStorage.getItem("ai_chat_api_base") || window.location.origin;
        usernameInput.value = localStorage.getItem("ai_chat_username") || "";
        if (token) tokenInput.value = token;

        function setSessionId(sid) {
          currentSessionId = String(sid || "").trim();
          sessionIdInput.value = currentSessionId;

          if (!currentSessionId) {
            sessionPill.textContent = "session_id: (auto)";
            sessionPill.style.borderColor = "#1f2937";
            return;
          }
          if (isUuid(currentSessionId)) {
            sessionPill.textContent = "session_id: UUID ✓";
            sessionPill.style.borderColor = "#10b981";
          } else {
            sessionPill.textContent = "session_id: invalid";
            sessionPill.style.borderColor = "#ef4444";
          }

          localStorage.setItem("ai_chat_session_id", currentSessionId);
          sessionStorage.setItem("ai_chat_session_id", currentSessionId);
        }

        function showTool(title, data) {
          toolTitle.textContent = title;
          toolPre.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
          toolOutput.style.display = "block";
        }

        async function apiFetch(path, options) {
          const res = await fetch(getApiUrl(path), options || {});
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            const msg = data && data.detail ? data.detail : res.status + " " + res.statusText;
            throw new Error(msg);
          }
          return data;
        }

        function authHeaders() {
          return { "Content-Type": "application/json", Authorization: "Bearer " + token };
        }

        function showChat(show) {
          chatPanel.style.display = show ? "block" : "none";
          btnLogout.style.display = show ? "inline-block" : "none";
          if (show) setSessionId(currentSessionId);
        }

        function appendMessage(role, content, meta) {
          const div = document.createElement("div");
          div.className = "msg " + role;
          div.innerHTML =
            '<div class="role"></div><div class="content"></div><div class="meta"></div>';
          div.querySelector(".role").textContent = role === "user" ? "Bạn" : "AI";
          div.querySelector(".content").textContent = content || "";
          div.querySelector(".meta").textContent = meta || "";
          messagesEl.appendChild(div);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // auto show if token exists
        if (token) {
          setStatus(loginStatus, "Đã có token (đã lưu).", "success");
          showChat(true);
        }

        btnLogin.addEventListener("click", async function () {
          const username = String(usernameInput.value || "").trim();
          const password = String(passwordInput.value || "");
          if (!username || !password) {
            setStatus(loginStatus, "Nhập user/email và mật khẩu.", "error");
            return;
          }
          localStorage.setItem("ai_chat_api_base", getBase());
          localStorage.setItem("ai_chat_username", username);

          btnLogin.disabled = true;
          setStatus(loginStatus, "Đang đăng nhập...", "");
          try {
            const data = await apiFetch("/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username_or_email: username, password }),
            });
            token = data.access_token || "";
            if (!token) throw new Error("Missing access_token");

            localStorage.setItem("ai_chat_token", token);
            sessionStorage.setItem("ai_chat_token", token);
            tokenInput.value = token;
            setStatus(loginStatus, "Đăng nhập OK.", "success");
            showChat(true);
          } catch (e) {
            setStatus(loginStatus, "Lỗi: " + e.message, "error");
          } finally {
            btnLogin.disabled = false;
          }
        });

        btnUseToken.addEventListener("click", function () {
          const t = String(tokenInput.value || "").trim();
          if (!t) {
            setStatus(loginStatus, "Dán token vào ô Bearer token trước.", "error");
            return;
          }
          token = t;
          localStorage.setItem("ai_chat_token", token);
          sessionStorage.setItem("ai_chat_token", token);
          localStorage.setItem("ai_chat_api_base", getBase());
          setStatus(loginStatus, "Đã lưu token.", "success");
          showChat(true);
        });

        btnLogout.addEventListener("click", function () {
          token = "";
          currentSessionId = "";
          localStorage.removeItem("ai_chat_token");
          sessionStorage.removeItem("ai_chat_token");
          localStorage.removeItem("ai_chat_session_id");
          sessionStorage.removeItem("ai_chat_session_id");
          setStatus(loginStatus, "Đã đăng xuất.", "");
          showChat(false);
        });

        sessionIdInput.addEventListener("input", function () {
          setSessionId(sessionIdInput.value);
        });

        sessionSelect.addEventListener("change", function () {
          const v = String(sessionSelect.value || "").trim();
          if (v) setSessionId(v);
        });

        btnClear.addEventListener("click", function () {
          messagesEl.innerHTML = "";
          toolOutput.style.display = "none";
          setStatus(sendStatus, "Đã clear.", "");
        });

        btnSessions.addEventListener("click", async function () {
          if (!token) return;
          btnSessions.disabled = true;
          setStatus(sendStatus, "Đang tải sessions...", "");
          try {
            const list = await apiFetch("/ai-chat/sessions", { headers: authHeaders() });
            const ids = (list || [])
              .map((s) => s.session_id || s.sessionId)
              .filter(Boolean);
            sessionSelect.innerHTML =
              '<option value="">(Chọn session…)</option>' +
              ids.map((id) => '<option value="' + id + '">' + id + "</option>").join("");
            setStatus(sendStatus, "OK: " + ids.length + " sessions.", "success");
          } catch (e) {
            setStatus(sendStatus, "Lỗi: " + e.message, "error");
          } finally {
            btnSessions.disabled = false;
          }
        });

        btnStart.addEventListener("click", async function () {
          if (!token) return;
          btnStart.disabled = true;
          setStatus(sendStatus, "Đang tạo session...", "");
          try {
            const name = "UI session " + new Date().toISOString().replace("T", " ").replace("Z", "");
            const data = await apiFetch("/ai-chat/start", {
              method: "POST",
              headers: authHeaders(),
              body: JSON.stringify({ session_name: name, initial_context: null }),
            });
            const sid = data.session_id || data.sessionId || "";
            setSessionId(sid);
            providerPill.textContent = "provider: " + String(data.provider || "—");
            appendMessage(
              "assistant",
              data.greeting_message || data.greetingMessage || data.greeting || "[Session mới]",
              "Provider: " + (data.provider || "")
            );
            setStatus(sendStatus, "Đã tạo session.", "success");
          } catch (e) {
            setStatus(sendStatus, "Lỗi: " + e.message, "error");
          } finally {
            btnStart.disabled = false;
          }
        });

        btnHistory.addEventListener("click", async function () {
          if (!token) return;
          const sid = String(sessionIdInput.value || "").trim();
          if (!sid) {
            setStatus(sendStatus, "Nhập session_id (UUID) hoặc bấm 'Tạo session'.", "error");
            return;
          }
          if (!isUuid(sid)) {
            setStatus(sendStatus, "session_id không phải UUID hợp lệ.", "error");
            return;
          }
          btnHistory.disabled = true;
          setStatus(sendStatus, "Đang tải history...", "");
          try {
            const data = await apiFetch("/ai-chat/history/" + encodeURIComponent(sid) + "?limit=50", {
              headers: authHeaders(),
            });
            messagesEl.innerHTML = "";
            (data || []).forEach((m) =>
              appendMessage(m.role === "user" ? "user" : "assistant", m.content || "", m.timestamp || "")
            );
            setStatus(sendStatus, "Đã tải history.", "success");
          } catch (e) {
            setStatus(sendStatus, "Lỗi: " + e.message, "error");
          } finally {
            btnHistory.disabled = false;
          }
        });

        btnDebug.addEventListener("click", async function () {
          if (!token) return;
          btnDebug.disabled = true;
          setStatus(sendStatus, "Đang gọi debug...", "");
          try {
            const data = await apiFetch("/ai-chat/debug", { headers: authHeaders() });
            providerPill.textContent = "provider: " + String(data.provider || "—");
            contextPill.textContent = "context: " + String(data.context_source || "—");
            showTool("AI Chat Debug", data);
            setStatus(sendStatus, "OK.", "success");
          } catch (e) {
            setStatus(sendStatus, "Lỗi: " + e.message, "error");
          } finally {
            btnDebug.disabled = false;
          }
        });

        btnContext.addEventListener("click", async function () {
          if (!token) return;
          btnContext.disabled = true;
          setStatus(sendStatus, "Đang tải context-preview...", "");
          try {
            const data = await apiFetch("/ai-chat/context-preview", { headers: authHeaders() });
            showTool("AI Chat Context Preview", data);
            setStatus(sendStatus, "OK.", "success");
          } catch (e) {
            setStatus(sendStatus, "Lỗi: " + e.message, "error");
          } finally {
            btnContext.disabled = false;
          }
        });

        btnSend.addEventListener("click", async function () {
          const text = String(messageInput.value || "").trim();
          if (!text) return;
          if (!token) {
            setStatus(sendStatus, "Chưa có token.", "error");
            return;
          }
          const sid = String(sessionIdInput.value || "").trim();
          if (sid && !isUuid(sid)) {
            setStatus(sendStatus, "session_id phải là UUID hợp lệ (hoặc để trống để auto tạo).", "error");
            return;
          }

          appendMessage("user", text, "");
          messageInput.value = "";
          btnSend.disabled = true;
          setStatus(sendStatus, "Đang gửi...", "");
          try {
            const body = { message: text };
            if (sid) body.session_id = sid;
            const data = await apiFetch("/ai-chat/send", {
              method: "POST",
              headers: authHeaders(),
              body: JSON.stringify(body),
            });
            const reply = data.message || data.content || data.answer || data.text || "";
            const meta = (data.provider ? "Provider: " + data.provider : "") + (data.timestamp ? " • " + data.timestamp : "");
            appendMessage("assistant", reply, meta);
            providerPill.textContent = "provider: " + String(data.provider || "—");

            if (data.session_id) setSessionId(String(data.session_id));
            if (data.created_session && data.greeting_message)
              appendMessage("assistant", "[Session mới] " + data.greeting_message, "");

            setStatus(sendStatus, "OK.", "success");
          } catch (e) {
            appendMessage("assistant", "Lỗi: " + e.message, "");
            setStatus(sendStatus, "Lỗi: " + e.message, "error");
          } finally {
            btnSend.disabled = false;
          }
        });

        messageInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            btnSend.click();
          }
        });

        // finalize init
        setSessionId(currentSessionId);
      })();
    </script>
  </body>
</html>
